[package]
name = "wakezilla-frontend"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlDialogElement", "HtmlInputElement", "HtmlSelectElement", "HtmlTextAreaElement", "HtmlElement", "Storage", "Window", "Document", "Element", "KeyboardEvent", "SubmitEvent"] }
console_error_panic_hook = "0.1"
futures = "0.3"
wakezilla-common = { path = "../common" }
