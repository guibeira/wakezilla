[workspace]
members = [".", "frontend", "common"]
resolver = "2"

[features]
default = []
desktop-tray = [
    "dep:arboard",
    "dep:gtk",
    "dep:open",
    "dep:png",
    "dep:single-instance",
    "dep:tray-icon",
    "dep:winit",
]

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1

[package]
name = "wakezilla"
version = "0.2.14"
edition = "2021"
build = "build.rs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/guibeira/wakezilla"
homepage = "https://github.com/guibeira/wakezilla"
description = "A Wake-on-LAN proxy server written in Rust"
keywords = ["wol", "proxy", "rust"]
categories = ["command-line-utilities", "network-programming", "web-programming"]
include = [
    "src/**",
    "tests/**",
    "frontend/Cargo.toml",
    "frontend/Cargo.lock",
    "frontend/Trunk.toml",
    "frontend/index.html",
    "frontend/favicon.ico",
    "frontend/src/**",
    "frontend/style/**",
    "frontend/public/**",
    "frontend-dist/**",
    "build.rs",
    "build_support.rs",
    "common/Cargo.toml",
    "common/src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
]

[[bin]]
name = "wakezilla-tray"
path = "src/bin/wakezilla-tray.rs"
required-features = ["desktop-tray"]

[dependencies]
clap = { version = "4", features = ["derive"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.38.0", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util", "signal"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ipnetwork = "0.20.0"
dns-lookup = "2.0.4"
futures-util = "0.3"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
crossterm = "0.29"
validator = { version = "0.20.0", features = ["derive"] }
regex = "1.11.2"
once_cell = "1.19.0"
anyhow = "1.0.103"
config = { version = "0.14", features = ["toml", "yaml", "json"] }
toml = "0.8"
tower = "0.5"
tower-http  = {version = "0.6.6", features = [ "cors", "fs"] }
mime_guess = "2.0"
include_dir = "0.7.4"
wakezilla-common = { path = "common", version = "0.1.0" }
semver = "1.0"
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
flate2 = "1.0"
tar = "0.4"
tempfile = "3"
base64 = "0.22.1"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }
open = { version = "5.3.6", optional = true }
png = { version = "0.18", optional = true }
tray-icon = { version = "0.24.1", default-features = false, features = ["gtk"], optional = true }
winit = { version = "0.30", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
single-instance = { version = "0.3.3", optional = true }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[target.'cfg(not(windows))'.dependencies]
pnet = "0.34.0"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
which = "4"
